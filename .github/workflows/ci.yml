name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # The inbound transport is timing-sensitive in ways that differ between
        # Linux and macOS (socket-close/RST semantics), so test on both.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Checkout hermes-agent (pinned)
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 8fc0374447313e276f6b9a2764bfc750190c966a
          path: hermes-reference
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # hermes-agent can't be pip-installed (its setup.py refuses wheel/sdist
      # builds) and its dependencies are all gated to `python_version >= '3.14'`,
      # so sync the pinned checkout's locked runtime deps without building the
      # project itself, and import gateway/hermes_cli from source via PYTHONPATH.
      - name: Sync hermes-agent runtime dependencies
        working-directory: hermes-reference
        run: uv sync --no-install-project --no-dev

      - name: Install pytest and coverage
        run: uv pip install --python hermes-reference/.venv/bin/python pytest pytest-cov

      # Coverage is measured on the parent process. The v1 client (a2a-extended)
      # runs its network worker in a spawned subprocess; that code is exercised by
      # the integration tests but not visible to coverage's parent-process trace,
      # so client.py/policy.py under-report. See docs/TESTING.md.
      - name: Run tests with coverage
        env:
          PYTHONPATH: ${{ github.workspace }}/hermes-reference:${{ github.workspace }}
          HERMES_DISABLE_LAZY_INSTALLS: "1"
        run: |
          export HERMES_HOME="$(mktemp -d)"
          hermes-reference/.venv/bin/python -m pytest tests/ \
            --cov=a2a-async --cov=a2a-extended \
            --cov-report=term-missing --cov-fail-under=70 -q

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
